<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">

  <head>
    {{ partial "head.html" . }}
  </head>

  <body{{ with .Layout }} class="layout-{{ . }}"{{ end }}>
    <div class='main-box'>
      <header>
        {{ partial "header.html" . }}
      </header>

      <main>
        {{ block "main" . }}{{ end }}
      </main>

      <footer>
        {{ partial "footer.html" . }}
      </footer>
    </div>
  </body>

</html>
